name: 原生安装包检查

on:
  push:
    branches: [main]
    paths:
      - 'scripts/installer/**'
      - 'scripts/package_*.sh'
      - 'scripts/package_windows.ps1'
      - 'scripts/test_windows_installer.ps1'
      - 'scripts/build_macos_dmg.py'
      - 'scripts/macos-dmg-requirements.txt'
      - '.github/workflows/installer-check.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PUB_HOSTED_URL: https://pub.dev

jobs:
  native-installer:
    name: 安装验证 ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x64
            os: windows-latest
            architecture: x64
          - target: macos-universal
            os: macos-15
            architecture: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 读取版本
        id: version
        run: python scripts/release_tools.py metadata --github-output
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.version.outputs.flutter }}
          architecture: ${{ matrix.architecture }}
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: 构建并验证 Windows 安装修复卸载
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          Push-Location apps/vex
          flutter build windows --release --target lib/main.dart
          if ($LASTEXITCODE -ne 0) { throw 'Windows release build failed.' }
          Pop-Location
          $compiler = ./scripts/install_inno.ps1
          ./scripts/package_windows.ps1 -Version $env:APP_VERSION -Compiler $compiler
          ./scripts/test_windows_installer.ps1 -Installer "artifacts/release/Vex-v$env:APP_VERSION-windows-x64-setup.exe" -Version $env:APP_VERSION
      - name: 构建并验证 macOS 通用拖拽安装映像
        if: runner.os == 'macOS'
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
          CI: 'true'
        run: |
          flutter config --no-enable-macos-arm64-only
          (cd apps/vex && flutter build macos --release --target lib/main.dart)
          python -m pip install --require-hashes -r scripts/macos-dmg-requirements.txt
          bash scripts/package_macos.sh "$APP_VERSION"
      - name: 验证安装包与校验文件
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          python scripts/release_tools.py checksums --targets "$TARGET"
          python scripts/release_tools.py verify --targets "$TARGET"
      - uses: actions/upload-artifact@v4
        with:
          name: checked-${{ matrix.target }}
          path: artifacts/release/*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
