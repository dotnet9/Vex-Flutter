name: 原生安装包检查

on:
  push:
    branches: [main]
    paths:
      - 'scripts/installer/**'
      - 'scripts/packaging/**'
      - 'scripts/test_windows_installer.ps1'
      - 'scripts/test_windows_update.ps1'
      - 'scripts/tests/**'
      - 'build-windows.bat'
      - '.github/workflows/installer-check.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PUB_HOSTED_URL: https://pub.dev

jobs:
  native-installer:
    name: 安装验证 ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x64
            os: windows-latest
            architecture: x64
          - target: macos-universal
            os: macos-15
            architecture: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 读取版本
        id: version
        run: python scripts/packaging/shared/release_tools.py metadata --github-output
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.version.outputs.flutter }}
          architecture: ${{ matrix.architecture }}
          channel: stable
          cache: true
      - name: 构建并验证 Windows 安装修复卸载
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          python scripts/packaging/build.py win-x64 --skip-tests --no-open-folder --output artifacts/release
          if ($LASTEXITCODE -ne 0) { throw 'Windows release build failed.' }
          ./scripts/test_windows_installer.ps1 -Installer "artifacts/release/Vex-v$env:APP_VERSION-windows-x64-setup.exe" -Version $env:APP_VERSION
          $compiler = ./scripts/packaging/win-x64/install_inno.ps1
          ./scripts/packaging/win-x64/package.ps1 -Version $env:APP_VERSION -Compiler $compiler -InstallerTest -OutputDirectory artifacts/update-smoke
          ./scripts/test_windows_update.ps1 -Installer "artifacts/update-smoke/Vex-v$env:APP_VERSION-windows-x64-setup.exe" -InstallerTest
      - name: 构建并验证 macOS 通用拖拽安装映像
        if: runner.os == 'macOS'
        run: python scripts/packaging/build.py osx-universal --skip-tests --output artifacts/release
      - name: 验证安装包与校验文件
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          python scripts/packaging/shared/release_tools.py verify --targets "$TARGET"
      - uses: actions/upload-artifact@v4
        with:
          name: checked-${{ matrix.target }}
          path: artifacts/release/*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
