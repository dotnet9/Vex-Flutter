name: 检查与测试

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      ref:
        required: false
        type: string

permissions:
  contents: read

env:
  PUB_HOSTED_URL: https://pub.dev

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 从 docs 生成内置文档
        run: python scripts/sync_builtin_documents.py
      - name: 原型契约检查
        run: |
          for script in design/scripts/verify*.cjs; do
            node "$script"
          done
      - name: 读取固定 Flutter 版本
        id: flutter
        run: echo "version=$(cat .flutter-version)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.flutter.outputs.version }}
          channel: stable
          cache: true
      - name: 安装锁定依赖
        run: flutter pub get --enforce-lockfile
      - name: Dart 格式检查
        run: git ls-files -z '*.dart' | xargs -0 dart format --output=none --set-exit-if-changed
      - name: 静态分析
        run: flutter analyze --no-pub
      - name: 核心文档与历史测试
        working-directory: packages/vex_markdown_core
        run: dart test --coverage=coverage
      - name: 编辑器测试
        working-directory: packages/vex_editor
        run: flutter test --no-pub --coverage
      - name: 导图测试
        working-directory: packages/vex_mindmap
        run: flutter test --no-pub --coverage
      - name: 应用测试
        working-directory: apps/vex
        run: flutter test --no-pub --coverage
      - name: 安装包发布边界测试
        run: |
          python -m unittest discover -s scripts/tests -v
          find scripts/packaging -name '*.sh' -exec bash -n {} \;
      - name: 保存测试覆盖率
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-coverage
          path: |
            packages/vex_markdown_core/coverage/
            packages/vex_editor/coverage/lcov.info
            packages/vex_mindmap/coverage/lcov.info
            apps/vex/coverage/lcov.info
          if-no-files-found: warn
          retention-days: 14

  android-release-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 生成内置文档
        run: python scripts/sync_builtin_documents.py
      - name: 读取固定 Flutter 版本
        id: flutter
        run: echo "version=$(cat .flutter-version)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.flutter.outputs.version }}
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: 启用模拟器硬件加速
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: 压缩版启动与底部菜单原生回归
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb shell cmd overlay enable com.android.internal.systemui.navbar.threebutton
            cd apps/vex/android && ./gradlew app:connectedPreviewReleaseAndroidTest -PvexReleaseTests=true -Ptarget="$GITHUB_WORKSPACE/apps/vex/integration_test/android_startup_test.dart" --max-workers=2
      - name: 检查压缩后的 JNI 方法签名
        run: python scripts/packaging/android/verify_jni.py apps/vex/build/app/outputs/apk/preview/release/app-preview-release.apk --dexdump "$ANDROID_HOME/build-tools/36.0.0/dexdump"
      - name: 保存原生测试结果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-release-smoke
          path: |
            apps/vex/build/app/outputs/androidTest-results/
            apps/vex/build/app/reports/androidTests/
          if-no-files-found: warn
          retention-days: 14
